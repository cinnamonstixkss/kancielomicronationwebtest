
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Official e-government website of the Republic of Kancielo.">

    <title>Kancielo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            color: #25272b;
        }

        .official-notice {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 12px 4.2%;
            background-color: #eef0f7;
            font-size: 15px;
            line-height: 1.5;
        }

        .official-notice img {
            width: 22px;
            height: auto;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .notice-text {
            margin: 0;
        }

        main {
            padding: 16px;
        }

        .greeting {
            margin: 0 0 16px;
            font-size: 18px;
            line-height: 1.5;
        }

        .body {
            margin: 0;
            font-size: 16px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .official-notice {
                padding: 10px 16px;
                font-size: 14px;
            }

            .greeting {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="official-notice">
            <img src="flag.png" alt="Kancielo flag">

            <p class="notice-text">
                This website is the official e-government website of the Republic of Kancielo.
            </p>
        </div>
    </header>

    <main>
        <p class="greeting">
            Hello there! This is a micronation and a test website
            for if we had a website. Anyway, bye!
        </p>

        <p class="body">
            Test
        </p>
    </main>

</body>
</html>
