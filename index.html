
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            font-family: Arial, sans-serif;
            color: #25272b;
        }

        .official-notice {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 17px 4.2%;
            background: #eef0f7;
            font-size: clamp(20px, 3vw, 34px);
            line-height: 1.42;
        }

        .official-notice img {
            width: 40px;
            height: auto;
            flex-shrink: 0;
            margin-top: 8px;
        }

        .notice-text {
            margin: 0;
        }

        .greeting {
            margin: 16px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="official-notice">
        <img src="flag.png" alt="South Korean flag">

        <p class="notice-text">
            This website is the official e-government website of the Republic of Kancielo.
        </p>
    </div>

    <p class="greeting">hello there this is a micronarion and a test website for if we had a website any way byee</p>

</body>
</html>
